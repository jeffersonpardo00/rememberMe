<main class="page-shell">
  <header class="page-header">
    <a class="brand" href="/" aria-label="Inicio de Remember Me">
      <span>Mario<span class="brand__accent">Pardo</span></span>
    </a>
    <p class="page-header__date">De choachi para el mundo</p>
    <button class="add-button" type="button" aria-label="Crear un recuerdo" (click)="openNewMemory()">+ <span>Nuevo recuerdo</span></button>
  </header>

  <section class="intro" aria-labelledby="page-title">
    <h2 id="page-title">Recuerdos de un<br /></h2>
    <h1 id="page-accent-title">Alma Libre</h1>
    <p class="eyebrow">Recordemos con una sonrisa.</p>
  </section>

  <app-memories-gird [memories]="memories" />
</main>

@if (isNewMemoryOpen()) {
  <app-new-memory (closed)="closeNewMemory()" (submitted)="saveNewMemory($event)" />
}
